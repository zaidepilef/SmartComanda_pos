<div class="overlay" [class.active]="open()">
  <div class="modal">
    <div class="modal-head">
      <h3>{{ title() }}</h3>
      <button type="button" class="x" (click)="close()" aria-label="Cerrar">&times;</button>
    </div>
    <div class="modal-body">
      <ng-content />
    </div>
    <div class="modal-foot">
      <ng-content select="[foot]" />
    </div>
  </div>
</div>
