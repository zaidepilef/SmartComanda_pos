server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Runtime configuration: never cache it, so a Redeploy with new values applies at once.
    location = /frontend-pos/env.js {
        alias /usr/share/nginx/html/env.js;
        add_header Cache-Control "no-store";
    }

    location = /env.js {
        add_header Cache-Control "no-store";
    }

    # App Angular servida bajo /frontend-pos/
    # Los archivos de build viven en la raíz del contenedor, pero el baseHref
    # hace que el navegador pida /frontend-pos/*. Por eso se usa alias.
    location /frontend-pos/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri @fallback;
    }

    location @fallback {
        rewrite ^ /frontend-pos/index.html last;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
